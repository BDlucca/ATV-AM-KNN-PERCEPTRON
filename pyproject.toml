[project]
name = "atv-am"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BDlucca", email = "brunodelucca12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
atv-am = "atv_am:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "notebook>=7.6.3",
]
